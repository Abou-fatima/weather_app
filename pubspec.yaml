name: weather_app
description: A weather app with authentication, API calls, and offline support
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Navigation
  go_router: ^14.2.0
  
  # Architecture
  flutter_bloc: ^8.1.3
  get_it: ^7.6.4
  equatable: ^2.0.5
  
  # Network
  dio: ^5.4.0
  retrofit: ^4.0.3
  logger: ^2.0.2
  
  # Local Storage
  hive_flutter: ^1.1.0
  hive: ^2.2.3
  path_provider: ^2.1.1
  
  # Connectivity
  connectivity_plus: ^5.0.2
  
  # UI
  flutter_svg: ^2.0.9
  intl: ^0.18.1
  shimmer: ^3.0.0
  pull_to_refresh: ^2.0.0
  
  # Utils
  dartz: ^0.10.1
  flutter_dotenv: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  mockito: ^5.4.3
  build_runner: ^2.4.7
  retrofit_generator: ^7.0.8
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/